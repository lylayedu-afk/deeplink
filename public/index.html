<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Deeplink App</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #f4f6fa;
      color: #172033;
    }
    main {
      max-width: 360px;
      margin: 24px;
      padding: 32px;
      text-align: center;
      border-radius: 20px;
      background: white;
    }
    a {
      display: block;
      margin-top: 24px;
      padding: 14px;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      text-decoration: none;
    }
    p { line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>Open Deeplink App</h1>
    <p>View this product in the app.</p>
    <a id="open-app" hidden>Open app</a>
    <p id="availability">App coming soon on Google Play.</p>
  </main>

  <script>
    // Add your real Play Store URL here when the app is published.
    const playStoreUrl = "";

    const productPath = /^\/product\/[^/]+\/?$/.test(location.pathname);
    const button = document.getElementById("open-app");

    if (productPath && /Android/i.test(navigator.userAgent)) {
      const fallback = playStoreUrl ||
        `${location.origin}/?unavailable=1`;

      button.href =
        `intent://${location.host}${location.pathname}` +
        `#Intent;scheme=https;package=com.app.deeplink_app;` +
        `S.browser_fallback_url=${encodeURIComponent(fallback)};end`;

      button.hidden = false;
    }

    if (playStoreUrl) {
      const download = document.createElement("a");
      download.href = playStoreUrl;
      download.textContent = "Download on Google Play";
      document.getElementById("availability").replaceWith(download);
    }

    if (new URLSearchParams(location.search).has("unavailable")) {
      document.querySelector("h1").textContent = "App unavailable";
      document.querySelector("main > p").textContent =
        "The app could not be opened on this device.";
    }
  </script>
</body>
</html>
